name: WinHub Production Build (Optimized)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using standard LTS to ensure stable runner execution

      - name: Generate Source Files & Info.plist
        run: |
          mkdir -p WinHub
          
          # 1. Generate Info.plist
          cat <<'EOF' > WinHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>WinHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.winhub.emulator.promax</string>
            <key>CFBundleName</key>
            <string>WinHub</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF

          # 2. Generate LaunchScreen.swift
          cat <<'EOF' > WinHub/LaunchScreen.swift
          import UIKit
          class LaunchScreen: UIViewController {}
          EOF

          # 3. Generate App.swift
          cat <<'EOF' > WinHub/App.swift
          import SwiftUI

          @main
          struct WinHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      MainView()
                  }
              }
          }

          struct MainView: View {
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      VStack {
                          Text("WINHUB").font(.system(size: 50, weight: .black)).foregroundColor(.blue)
                          Text("Status: System Operational").foregroundColor(.green)
                          Spacer()
                          Text("Sifat, 15 Pro Max Environment Ready").foregroundColor(.pink)
                      }
                      .padding()
                  }
              }
          }
          EOF

          # 4. Generate Xcode Project
          # Note: Ensure your project.yml is present in the root directory of your repository.
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project WinHub.xcodeproj \
            -scheme WinHub \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/WinHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package IPA
        run: |
          # Create the required iOS Payload structure
          mkdir -p build/Payload
          
          # Copy the compiled .app bundle into the Payload directory using -R to ensure all contents transfer cleanly
          cp -R build/WinHub.xcarchive/Products/Applications/WinHub.app build/Payload/
          
          # Zip the Payload folder to create the .ipa
          cd build
          zip -qr WinHub_Final.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHub-iOS-Package
          path: build/WinHub_Final.ipa
          retention-days: 7
