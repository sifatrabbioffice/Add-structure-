name: WinHub Production Build (Fixed Null Error)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate Source Files and Plist
        run: |
          mkdir -p WinHub
          
          # ১. Info.plist তৈরি (সংশোধিত - CFBundleExecutable যুক্ত করা হয়েছে)
          cat <<'EOF' > WinHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>WinHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.winhub.emulator.promax</string>
            <key>CFBundleName</key>
            <string>WinHub</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF

          # ২. LaunchScreen.swift তৈরি
          cat <<'EOF' > WinHub/LaunchScreen.swift
          import UIKit
          class LaunchScreen: UIViewController {}
          EOF

          # ৩. App.swift (Final Fix: Support all file types including .exe)
          cat <<'EOF' > WinHub/App.swift
          import SwiftUI
          import UniformTypeIdentifiers

          @main
          struct WinHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      PS4HomeView()
                  }
              }
          }

          struct PS4HomeView: View {
              @State private var selectedGameName: String = "No EXE Selected"
              @State private var selectedFileURL: URL? = nil
              @State private var isBooting = false
              @State private var showFileImporter = false
              @State private var selectedIndex = 0
              
              let menuItems = [
                  ("Run Game", "play.fill", Color.green),
                  ("Import EXE", "doc.badge.plus", Color.blue),
                  ("Settings", "slider.horizontal.3", Color.gray)
              ]

              var body: some View {
                  ZStack {
                      // PS4 Premium Background
                      LinearGradient(gradient: Gradient(colors: [Color(red: 0, green: 0, blue: 0.2), .black]), startPoint: .top, endPoint: .bottom)
                          .ignoresSafeArea()

                      if isBooting {
                          EmulatorView(exeURL: selectedFileURL) { isBooting = false }
                      } else {
                          VStack(spacing: 30) {
                              // Top Header
                              HStack {
                                  VStack(alignment: .leading) {
                                      Text("Sifat-E-Rabbi's Console").font(.title2).bold()
                                      Text(selectedGameName).font(.subheadline).foregroundColor(.blue)
                                  }
                                  Spacer()
                                  Image(systemName: "wifi").padding()
                                  Text("12:00").bold()
                              }
                              .foregroundColor(.white).padding(.horizontal, 50).padding(.top, 20)

                              Spacer()

                              // Menu Selection
                              HStack(spacing: 40) {
                                  ForEach(0..<menuItems.count, id: \.self) { index in
                                      VStack {
                                          ZStack {
                                              RoundedRectangle(cornerRadius: 25)
                                                  .fill(menuItems[index].2.opacity(selectedIndex == index ? 0.9 : 0.4))
                                                  .frame(width: 200, height: 200)
                                                  .overlay(
                                                      RoundedRectangle(cornerRadius: 25)
                                                          .stroke(selectedIndex == index ? Color.white : Color.clear, lineWidth: 6)
                                                  )
                                                  .shadow(color: selectedIndex == index ? menuItems[index].2 : .clear, radius: 20)

                                              Image(systemName: menuItems[index].1)
                                                  .font(.system(size: 70))
                                                  .foregroundColor(.white)
                                          }
                                          Text(menuItems[index].0).foregroundColor(.white).font(.headline).padding(.top, 10)
                                      }
                                      .scaleEffect(selectedIndex == index ? 1.1 : 0.9)
                                      .onTapGesture {
                                          selectedIndex = index
                                          if index == 0 && selectedFileURL != nil {
                                              isBooting = true
                                          } else if index == 1 {
                                              showFileImporter = true
                                          }
                                      }
                                  }
                              }

                              Spacer()
                              
                              Text("Select the EXE file from your library and press Run").font(.caption).foregroundColor(.gray)
                          }
                      }
                  }
                  // এখানে .data এবং .item টাইপ যোগ করা হয়েছে যাতে .exe ফাইল সিলেক্ট করা যায়
                  .fileImporter(
                      isPresented: $showFileImporter,
                      allowedContentTypes: [UTType.data, UTType.item, UTType.content],
                      allowsMultipleSelection: false
                  ) { result in
                      do {
                          guard let url = try result.get().first else { return }
                          
                          // সিকিউরিটি পারমিশন নেওয়া
                          if url.startAccessingSecurityScopedResource() {
                              selectedFileURL = url
                              selectedGameName = url.lastPathComponent
                              url.stopAccessingSecurityScopedResource()
                          }
                      } catch {
                          print("Error: \(error.localizedDescription)")
                      }
                  }
              }
          }

          struct EmulatorView: View {
              let exeURL: URL?
              var onExit: () -> Void
              
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      VStack {
                          HStack {
                              Button(action: onExit) {
                                  Image(systemName: "power").font(.title).foregroundColor(.red)
                              }.padding(40)
                              Spacer()
                          }
                          
                          Spacer()
                          
                          VStack(spacing: 30) {
                              Image(systemName: "cpu").font(.system(size: 80)).foregroundColor(.blue)
                              Text("BOOTING SYSTEM").font(.largeTitle).bold().foregroundColor(.white)
                              Text("Loading: \(exeURL?.lastPathComponent ?? "Unknown")").foregroundColor(.gray)
                              ProgressView().tint(.white).scaleEffect(1.5)
                          }
                          
                          Spacer()
                          
                          // Bottom Controls (PS4 Layout)
                          HStack {
                              Circle().stroke(Color.white.opacity(0.2), lineWidth: 2).frame(width: 120, height: 120).overlay(Text("L"))
                              Spacer()
                              Circle().stroke(Color.white.opacity(0.2), lineWidth: 2).frame(width: 120, height: 120).overlay(Text("R"))
                          }.padding(60)
                      }
                  }
              }
          }
          EOF





          # ৪. প্রোজেক্ট জেনারেশন
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project WinHub.xcodeproj \
            -scheme WinHub \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/WinHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -r build/WinHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr WinHub_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHub-App-Package
          path: build/WinHub_Final.ipa
