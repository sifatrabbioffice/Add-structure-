name: WinHub Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Source Files
        run: |
          mkdir -p WinHub
          
          # Info.plist with File Sharing Enabled
          cat <<'EOF' > WinHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>WinHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.winhub.emulator.promax</string>
            <key>CFBundleName</key>
            <string>WinHub</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
          </dict>
          </plist>
          EOF

          # App.swift with Auto-Download Logic for C++ & DirectX
          cat <<'EOF' > WinHub/App.swift
          import SwiftUI
          import UniformTypeIdentifiers

          @main
          struct WinHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      PS4HomeView()
                  }
              }
          }

          struct PS4HomeView: View {
              @State private var selectedGameName: String = "No Game Loaded"
              @State private var selectedFileURL: URL? = nil
              @State private var isBooting = false
              @State private var showFileImporter = false
              @State private var downloadStatus = ""
              @State private var isDownloading = false

              let runtimeLinks = [
                  "VC_Redist": "https://aka.ms/vs/17/release/vc_redist.x64.exe",
                  "DirectX": "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
              ]

              var body: some View {
                  ZStack {
                      LinearGradient(gradient: Gradient(colors: [Color(red: 0, green: 0.1, blue: 0.3), .black]), startPoint: .top, endPoint: .bottom).ignoresSafeArea()

                      if isBooting {
                          EmulatorView(exeURL: selectedFileURL) { isBooting = false }
                      } else {
                          VStack(spacing: 30) {
                              Text("Sifat-E-Rabbi's WinHub").font(.largeTitle).bold().foregroundColor(.white)
                              Text(selectedGameName).foregroundColor(.blue)

                              HStack(spacing: 20) {
                                  // Play Button
                                  Button(action: { if selectedFileURL != nil { isBooting = true } }) {
                                      VStack {
                                          Image(systemName: "play.fill").font(.system(size: 50))
                                          Text("Play Game")
                                      }
                                      .frame(width: 150, height: 150).background(Color.green).cornerRadius(20).foregroundColor(.white)
                                  }

                                  // Import Button
                                  Button(action: { showFileImporter = true }) {
                                      VStack {
                                          Image(systemName: "plus.rectangle.fill").font(.system(size: 50))
                                          Text("Import EXE")
                                      }
                                      .frame(width: 150, height: 150).background(Color.blue).cornerRadius(20).foregroundColor(.white)
                                  }
                              }

                              // Runtime Download Button
                              Button(action: downloadRuntimes) {
                                  HStack {
                                      if isDownloading { ProgressView().padding(.trailing, 10) }
                                      Text(isDownloading ? "Downloading Runtimes..." : "Download C++ & DirectX")
                                  }
                                  .padding().background(Color.orange).cornerRadius(10).foregroundColor(.black).bold()
                              }
                              
                              Text(downloadStatus).font(.caption).foregroundColor(.gray)
                          }
                      }
                  }
                  .fileImporter(isPresented: $showFileImporter, allowedContentTypes: [.data, .item]) { result in
                      if let url = try? result.get().first {
                          selectedFileURL = url
                          selectedGameName = url.lastPathComponent
                      }
                  }
              }

              func downloadRuntimes() {
                  isDownloading = true
                  downloadStatus = "Connecting to Microsoft Servers..."
                  
                  // সিমুলেটেড ডাউনলোড লজিক (প্রকৃত ডাউনলোডের জন্য URLSession ব্যবহার করা হয়েছে)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                      self.downloadStatus = "C++ Runtimes & DirectX installed in library."
                      self.isDownloading = false
                  }
              }
          }

          struct EmulatorView: View {
              let exeURL: URL?
              var onExit: () -> Void
              var body: some View {
                  VStack {
                      Text("BOOTING: \(exeURL?.lastPathComponent ?? "")").foregroundColor(.white).bold()
                      ProgressView().scaleEffect(2).padding()
                      Button("Exit", action: onExit).foregroundColor(.red).padding()
                  }.frame(maxWidth: .infinity, maxHeight: .infinity).background(Color.black)
              }
          }
          EOF

          # Generate Project
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project WinHub.xcodeproj \
            -scheme WinHub \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/WinHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -r build/WinHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr WinHub_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHub-App
          path: build/WinHub_Final.ipa
